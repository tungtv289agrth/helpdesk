[project]
name = "helpdesk"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "hello@frappe.io"}
]
description = "Open Source Customer Service Software"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Core dependencies
    "textblob==0.18.0.post0",

    # AI summary feature (helpdesk.api.ai_summary)
    # "pymupdf",                     # extract text from PDFs with a text layer
    # "mammoth",                     # convert DOCX to markdown
    # "pandas>=2.2,<3",              # read XLSX / CSV (first 20 rows); <3 to share env safely
    # "pytesseract",                 # OCR for scans and images
    # "pdf2image",                   # rasterize scanned PDFs before OCR
    # "opencv-python-headless",      # pre-process images before OCR
    # "sumy",                        # TextRank sentence compression
    # ref erpatch
]
[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.116.1,<17.0.0"
telephony = ">=0.0.1,<1.0.0"

[tool.bench.assets]
build_dir = "./desk"
out_dir = "./helpdesk/public/desk"
index_html_path = "./helpdesk/www/helpdesk/index.html"

[project.urls]
Homepage = "https://frappe.io/helpdesk"
Repository = "https://github.com/frappe/helpdesk.git"
"Bug Reports" = "https://github.com/frappe/helpdesk/issues"
